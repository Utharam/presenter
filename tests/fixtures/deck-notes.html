<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Speaker Notes Fixture</title>
  <style>
    .slide { display: none; }
    .slide.active { display: block; }
    .notes { display: none; }
  </style>
</head>
<body>
  <div class="slide active">
    Slide one
    <aside class="notes">Open with the promise.</aside>
  </div>
  <div class="slide">
    Slide two
    <aside class="notes">Pause after the second frame.</aside>
  </div>
  <div class="slide">
    Slide three
    <aside class="notes">Close on the invitation.</aside>
  </div>
</body>
</html>
